<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleto - Màu nước cao cấp</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #fff;
            color: #333;
            overflow-x: hidden;
        }

        /* Top Red Bar & Navigation */
        .top-nav {
            background-color: #b31412;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 40px;
            color: white;
            animation: slideDown 0.8s ease-out;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            position: relative;
            transition: opacity 0.3s;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: white;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 20px;
            padding: 5px 15px;
            width: 240px;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 13px;
            width: 100%;
            padding-left: 5px;
        }

        /* Hero Section */
        .hero-section {
            display: flex;
            justify-content: space-between;
            padding: 50px 40px;
            gap: 40px;
            max-width: 1300px;
            margin: 0 auto;
            animation: fadeIn 1.2s ease-out;
        }

        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .parrot-icon {
            width: 70px;
            height: 70px;
            animation: floatParrot 3s ease-in-out infinite;
        }

        .brand-text h1 {
            font-size: 32px;
            font-weight: 900;
            color: #111;
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 12px;
            font-weight: 700;
            color: #b31412;
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .hero-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-red {
            background-color: #b31412;
            color: white;
            border: none;
            padding: 12px 28px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-red:hover {
            background-color: #920f0d;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(179, 20, 18, 0.4);
        }

        .hero-right {
            flex: 1;
            background-color: #d9d9d9;
            height: 350px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .hero-right:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Section Ribbon */
        .section-ribbon {
            background-color: #b31412;
            color: white;
            padding: 12px 40px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 0.5px;
            margin: 20px 0;
            animation: pulseRibbon 2s infinite;
        }

        .content-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 40px 50px 40px;
        }

        .highlight-text {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 40px;
        }

        /* Best Sellers */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .product-card:hover {
            transform: translateY(-8px);
        }

        .product-img {
            background-color: #d9d9d9;
            height: 220px;
            border-radius: 4px;
            transition: filter 0.3s;
        }

        .product-card:hover .product-img {
            filter: brightness(0.95);
        }

        .product-info {
            text-align: center;
        }

        .product-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 5px;
            color: #222;
        }

        .product-price {
            font-weight: 800;
            color: #b31412;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .btn-buy {
            background-color: #b31412;
            color: white;
            border: none;
            padding: 10px 0;
            width: 100%;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-buy:hover {
            background-color: #920f0d;
            transform: scale(1.02);
        }

        /* Palette Tabs */
        .palette-tabs {
            display: flex;
            gap: 40px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .tab-item {
            font-weight: 700;
            font-size: 15px;
            color: #777;
            cursor: pointer;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s;
        }

        .tab-item.active {
            color: #b31412;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #b31412;
            animation: slideInTab 0.3s ease;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .palette-box {
            background-color: #d9d9d9;
            height: 130px;
            border-radius: 4px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .palette-box:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        /* Creative Corner */
        .section-title {
            font-weight: 900;
            font-size: 20px;
            margin-bottom: 20px;
            color: #111;
        }

        .creative-slider {
            display: flex;
            gap: 20px;
            align
